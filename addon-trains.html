<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доповнення: Поїзди TS2 | Pixel Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Сітка для карток доповнень */
        .trains-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 30px;
            margin-bottom: 60px;
        }

        /* Твоя фірмова картка з градієнтним верхом */
        .train-card {
            border: 1px solid #e0bfff;
            border-radius: 20px;
            overflow: hidden;
            background: #fff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: transform 0.2s;
        }
        .train-card:hover {
            transform: translateY(-5px);
        }

        /* Синьо-фіолетовий градієнтний блок (як на скріншоті) */
        .card-banner-blue {
            background: linear-gradient(135deg, #4a148c, #2979ff);
            padding: 50px 20px;
            text-align: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        /* Червоно-помаранчевий градієнтний блок (для різноманітності) */
        .card-banner-red {
            background: linear-gradient(135deg, #ff1744, #ff9100);
            padding: 50px 20px;
            text-align: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        /* Нижня частина картки (біла) */
        .card-body-content {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .price-tag {
            color: #311b92;
            font-weight: bold;
            font-size: 18px;
        }

        /* Кнопка-стрілочка в стилі твого сайту */
        .circle-arrow-btn {
            background: #fff;
            border: 1px solid #e0bfff;
            color: #4a148c;
            border-radius: 10px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .circle-arrow-btn:hover {
            background: #4a148c;
            color: #fff;
            border-color: #4a148c;
        }
    </style>
</head>

                <a href="games.html" class="nav-btn" style="text-decoration: none; color: white; background-color: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; font-size: 15px; font-weight: bold; transition: 0.2s;">готові ігри</a>
                <a href="promotions.html" class="nav-btn" style="text-decoration: none; color: white; background-color: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; font-size: 15px; font-weight: bold; transition: 0.2s;">акції</a>
                <a href="addons.html" class="nav-btn active" style="text-decoration: none; color: white; background-color: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; font-size: 15px; font-weight: bold; transition: 0.2s;">доповнення</a>
